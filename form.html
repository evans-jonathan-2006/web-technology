<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Registration Form</title>
    <link rel="icon" href="icon.ico"type="icon.ico">
    <style>
        legend{
            font-family: 'Times New Roman', Times, serif; 
        }
        h1{
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .pi{
            background-color: beige;
        }
        .ci{
            background-color: rgb(223, 223, 158);
        }
        .oi{
            background-color: rgb(199, 212, 212);
        }
        .in{
            text-align: center;
        }
        input{
                width: 180px;
                padding: 10px;
                border:2px solid pink;
                border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="form">
            <h1><mark>Club Membership Form</mark></h1>
            <form action="/serverlogic.php" method="post">
                <fieldset class="pi">
                    <legend>Personal Information</legend>
                    <label for="fname">Full Name:</label>
                    <input type="text" id="fname" name="fname" placeholder="Enter Your Name" required>
                    <br><br>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter Your Mail" required>
                    <br><br>
                    
                    <label for="pass">PassWord:</label>
                    <input type="password" id="pass" name="pass" placeholder="Enter Your Password" required>
                    <br><br>

                    <label for="num">Phone Number:</label>
                    <input type="text" id="num" name="num" placeholder="Enter Your Number" required>
                    <br><br>

                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob" required>
                    <br><br>

                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" min="18" max="70" placeholder="">
                    <br><br>
                </fieldset>
                <br>
                <fieldset class="ci">
                    <legend>Club Preferences</legend>
                    <label>Gender:</label>
                    <input type="radio" id="Male" name="gender">
                    <label for="Male">Male</label>
                    <input type="radio" id="fmale" name="gender">
                    <label for="fmale">Female</label>
                    <br><br>

                    <label>Intrests:</label>
                    <input type="checkbox" id="sports" name="intrest" >
                    <label for="sports">Sports</label>
                    <input type="checkbox" id="Music" name="intrest">
                    <label for="Music">Music</label>
                    <input type="checkbox" id="read" name="intrest">
                    <label for="read">Reading</label>
                    <br><br>

                    <label for="membership">MemberShip Type:</label>
                    <select id="membership" name="membership">
                        <option value=disabled selected>Select Type</option>
                        <option>Premium</option>
                        <option>Basic</option>
                    </select>
                    <br><br>

                    <label for="info">Tell About Yourself:</label>
                    <textarea id="info" name="info  " rows="6" cols="30" placeholder="In 150 Words"></textarea>
                    <br><br>

                    <label for="pp">Upload Photo for Profile:</label>
                    <input type="file" id="pp" name="pp">
                </fieldset>
                <br>
                <fieldset class="oi">
                    <legend>Other information</legend>
                    <label for="web">Website/Social Media Link:</label>
                    <input type="url" id="web" name="web" placeholder="Enter URL/Link">
                    <br><br>

                    <label for="search">Search for Club activities</label>
                    <input type="search" id="search" name="search" placeholder="Search here..">
                    <br><br>

                    <label for="progress">Registration Progress</label>
                    <progress id="progress" value="70" max="100"></progress>
                </fieldset>
                <br>
                <div class="in">
                    <input type="reset" value="Clear Form">
                    <input type="submit" value="Submit">

                </div>
                <hr>
            </form>


    </div>
    
</body>
</html>
